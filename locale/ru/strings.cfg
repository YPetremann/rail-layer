[technology-name]
rail-layer=Укладчик рельс

[technology-description]
rail-layer=Открывает специальный локомотив, который автоматически размещает призрачные рельсы во время движения.

[entity-name]
rail-layer=Укладчик рельс

[entity-description]
rail-layer=Автоматически размещает призрачные рельсы и сигналы по мере движения.\nПредметы должны быть загружены в грузовой вагон.

[mod-setting-name]
rail-layer__features=Функции:
rail-layer__experimental=Экспериментальные функции:
rail-layer__wip=Функции в разработке:
rail-layer__warnings_enable=     Показывать предупреждения при строительстве
rail-layer__stations_enable=     Размещение призрачных станций
rail-layer__power_poles_enable=     Размещение призрачных опор ЛЭП
rail-layer__power_poles_radius=          Радиус размещения опор ЛЭП
rail-layer__elevated_rail_enable=     Размещение призрачных надземных рельс
rail-layer__automatic_enable=     Автоматический режим укладчика рельс

[mod-setting-description]
rail-layer__features=Эти функции считаются стабильными и сбалансированными. При необходимости вы можете отключить некоторые из них.
rail-layer__experimental=Эти функции работают, но всё ещё являются экспериментальными и несбалансированными. Используйте, если хотите опробовать самые новые возможности.
rail-layer__wip=Эти функции могут содержать ошибки, вызывать сбои, аварийное завершение или проблемы с производительностью. Используйте на свой страх и риск.
rail-layer__warnings_enable=Если включено и управление производится вручную, укладчик рельс будет показывать предупреждения, когда не может разместить призрачные рельсы или сигналы.
rail-layer__stations_enable=Если включено, укладчик рельс также будет размещать призрачные станции.
rail-layer__power_poles_enable=Если включено, укладчик рельс также будет размещать призрачные опоры ЛЭП.\nЭто экспериментальная функция и может быть несбалансированной.
rail-layer__power_poles_radius=Радиус вокруг конца рельс для поиска опор ЛЭП, которые необходимо разместить.
rail-layer__elevated_rails_enable=Если включено, укладчик рельс также будет размещать призрачные надземные рельсы.\nЭто экспериментальная функция и может быть несбалансированной.
rail-layer__automatic_enable=Если укладчик рельс переведён в автоматический режим, он автоматически отправится на станцию снабжения и начнёт строительство железнодорожной сети.
